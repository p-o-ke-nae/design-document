# ddv の設定（対象リポジトリのルートに置く）
docsRoot: docs/design
mocksRoot: docs/mocks
idPrefix:
  requirements: REQ
  basic: BD
  detailed: DD
toc:
  minLevel: 2
  maxLevel: 3
matrix:
  nSwitch: 1      # Nスイッチの N（0 で無効）
  loopLimit: 1    # 単純経路で同じ遷移を通ってよい回数
  maxPaths: 200   # 経路数の上限（超えたら警告）
# モックが参照する実プロジェクトの CSS
styles: []
# テストの実行方法。テスト名/Trait にテストIDを書くと自動で紐づく
runners: []
#  - { name: web,    type: vitest,     cwd: web,    level: integration }
#  - { name: e2e,    type: playwright, cwd: web,    level: integration }
#  - { name: dotnet, type: dotnet,     cwd: tests,  level: unit }
#  - name: wpf                       # デスクトップ（Windows。シナリオを FlaUI で実行。ddv desktop doctor で確認）
#    type: flaui
#    platform: wpf                   # wpf / winforms
#    level: integration
#    app: { path: desktop/App/bin/Debug/net8.0-windows/App.exe }
#    source: desktop/App             # ddv-lint が AutomationId を探す画面定義（XAML・*.Designer.cs）の場所
# 実アプリのデザインのトークン（ddv tokens generate で <mocksRoot>/_tokens/<name>.css を生成）
# tokens:
#   - { name: app-wpf, kind: xaml, sources: [desktop/App/App.xaml] }
#   - { name: app-web, kind: css, sources: [web/src/styles/app.css], classes: [card] }
# 証跡（シナリオの evidence:）で使う DB と外部コマンド
# evidence:
#   databases:
#     app: { type: sqlite, env: DDV_DB_APP, mask: [password] }   # sqlite / sqlserver / postgres。接続文字列は環境変数から
#   commands:
#     app-log: { run: pwsh, args: [-File, scripts/collect-log.ps1, -Out, '{out}'] }
